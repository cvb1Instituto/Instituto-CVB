<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Instituto CVB</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="icon-full.png">
<link rel="stylesheet" href="style.css?v=20260819b">
</head>
<body class="admin-body">

<div class="admin-login-wrap">
  <div class="admin-login-box">
    <a href="index.html" class="admin-login-logo">
      <img src="logo-header.png" alt="Instituto CVB">
    </a>
    <h2 style="text-align:center; margin-top:8px;">Painel Admin</h2>
    <div id="loginError"></div>
    <form id="loginForm">
      <div class="admin-field">
        <label for="email">E-mail</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="admin-field">
        <label for="password">Senha</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;" id="loginBtn">Entrar</button>
    </form>
    <a href="index.html" class="admin-login-back">← Voltar para o site</a>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="config.js?v=20260819b"></script>
<script>
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) window.location.href = 'admin-dashboard.html';
  })();

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    errorEl.innerHTML = '';
    btn.disabled = true;
    btn.textContent = 'Entrando...';

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      errorEl.innerHTML = `<div class="admin-error">E-mail ou senha inválidos.</div>`;
      btn.disabled = false;
      btn.textContent = 'Entrar';
      return;
    }
    window.location.href = 'admin-dashboard.html';
  });
</script>
</body>
</html>
